<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Payment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Enterprise Payment Processing Portal</h1>
    <nav>
        <a href="index.html">Dashboard</a>
        <a href="create.html">Create Payment</a>
    </nav>
</header>

<div class="container">
    <div class="card">
        <h2>Create New Payment</h2>
        <p class="small-text">Submit a new company payment request with validation and idempotency protection.</p>
        <div id="messageBox"></div>

        <form id="paymentForm">
            <div class="row">
                <div class="col">
                    <label>Idempotency Key</label>
                    <input type="text" id="idempotencyKey" required>
                </div>
                <div class="col">
                    <label>Amount</label>
                    <input type="number" id="amount" step="0.01" required>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label>Currency</label>
                    <select id="currency" required>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                        <option value="INR">INR</option>
                    </select>
                </div>
                <div class="col">
                    <label>Payment Note</label>
                    <input type="text" id="note" placeholder="Optional internal note">
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label>Source Account</label>
                    <input type="text" id="sourceAccount" required>
                </div>
                <div class="col">
                    <label>Destination Account</label>
                    <input type="text" id="destinationAccount" required>
                </div>
            </div>

            <button type="submit">Create Payment</button>
        </form>
    </div>
</div>

<script src="script.js"></script>
<script>
    document.getElementById("paymentForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        clearMessage("messageBox");

        const payload = {
            idempotencyKey: document.getElementById("idempotencyKey").value,
            amount: parseFloat(document.getElementById("amount").value),
            currency: document.getElementById("currency").value,
            sourceAccount: document.getElementById("sourceAccount").value,
            destinationAccount: document.getElementById("destinationAccount").value
        };

        try {
            const result = await apiRequest(API_BASE, {
                method: "POST",
                body: JSON.stringify(payload)
            });

            showMessage("messageBox", `Payment created successfully. Payment ID: ${result.id}`, "success");

            setTimeout(() => {
                window.location.href = `details.html?id=${result.id}`;
            }, 1000);
        } catch (err) {
            showMessage("messageBox", `${err.errorCode || "ERROR"} - ${err.message || "Unable to create payment"}`, "error");
        }
    });
</script>
</body>
</html>
